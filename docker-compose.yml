version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stack-aivre-db
    environment:
      POSTGRES_DB: stack_aivre
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stack-aivre-redis
    ports:
      - "6379:6379"

  server:
    build:
      context: ./src
      dockerfile: StackByAivre.Server/Dockerfile
    container_name: stack-aivre-server
    ports:
      - "5000:5000"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=stack_aivre;Username=postgres;Password=postgres
      - Jwt__Secret=${JWT_SECRET:-YourSuperSecretKeyThatIsAtLeast32CharactersLong!}
      - AiProviders__OpenAiApiKey=${OPENAI_API_KEY:-}
      - AiProviders__AnthropicApiKey=${ANTHROPIC_API_KEY:-}
      - AiProviders__GoogleAiApiKey=${GOOGLE_AI_API_KEY:-}
      - AiProviders__DeepSeekApiKey=${DEEPSEEK_API_KEY:-}
      - AiProviders__MistralApiKey=${MISTRAL_API_KEY:-}
      - AiProviders__OllamaBaseUrl=http://host.docker.internal:11434
      - Spotify__ClientId=${SPOTIFY_CLIENT_ID:-}
      - Spotify__ClientSecret=${SPOTIFY_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
